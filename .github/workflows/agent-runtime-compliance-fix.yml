name: Agent runtime compliance fix

on:
  push:
    branches:
      - fix/api-runtime-compliance-20260817

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/api-runtime-compliance-20260817
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply runtime compliance patch
        run: |
          python - <<'PY'
          from pathlib import Path

          transport_path = Path('lib/ops/transport.ts')
          transport = transport_path.read_text()
          old = """    pathname.startsWith('/api/v1/website/') ||\n    pathname.startsWith('/api/v1/customer/') ||\n    pathname.startsWith('/api/v1/openapi/')"""
          new = """    pathname.startsWith('/api/v1/website/') ||\n    pathname.startsWith('/api/v1/customer/') ||\n    pathname.startsWith('/api/v1/customer-portal/') ||\n    pathname.startsWith('/api/v1/openapi/')"""
          if old not in transport:
              raise SystemExit('transport contract-version guard anchor not found')
          transport_path.write_text(transport.replace(old, new, 1))

          webhook_path = Path('lib/webhooks/opsWebhook.ts')
          webhook = webhook_path.read_text()
          old = """  'contract.needs_facility_data',\n  'power_of_attorney.signed',"""
          new = """  'contract.needs_facility_data',\n  'customer_application.status_changed',\n  'supplier_switch.updated',\n  'power_of_attorney.signed',"""
          if old not in webhook:
              raise SystemExit('webhook event allowlist anchor not found')
          webhook_path.write_text(webhook.replace(old, new, 1))

          test_path = Path('tests/gridex-runtime-hardening.test.mjs')
          test = test_path.read_text()
          import_anchor = "import { stockholmValidityStatus } from '../lib/website/businessDate.ts'\n"
          import_line = "import { isSupportedOpsWebhookEventType } from '../lib/webhooks/opsWebhook.ts'\n"
          if import_line not in test:
              if import_anchor not in test:
                  raise SystemExit('runtime test import anchor not found')
              test = test.replace(import_anchor, import_anchor + import_line, 1)

          transport_anchor = "assert.match(transport, /method === 'GET' \\\\|\\\\| method === 'HEAD'/)\n"
          # Match the source text directly as transport.ts imports Next.js aliases and is not safe to import in this raw Node test.
          transport_assertions = """assert.match(transport, /pathname\\.startsWith\\('\\/api\\/v1\\/customer-portal\\/'\\)/)\nassert.match(transport, /pathname\\.startsWith\\('\\/api\\/v1\\/customer\\/'\\)/)\n\nassert.equal(isSupportedOpsWebhookEventType('customer_application.status_changed'), true)\nassert.equal(isSupportedOpsWebhookEventType('supplier_switch.updated'), true)\nassert.equal(isSupportedOpsWebhookEventType('supplier_switch.unknown'), false)\n"""
          marker = "const client = [\n"
          if "customer_application.status_changed'), true" not in test:
              if marker not in test:
                  raise SystemExit('runtime test insertion anchor not found')
              test = test.replace(marker, transport_assertions + "\n" + marker, 1)
          test_path.write_text(test)
          PY

      - name: Targeted regression test
        run: node --experimental-strip-types tests/gridex-runtime-hardening.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/agent-runtime-compliance-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ops/transport.ts lib/webhooks/opsWebhook.ts tests/gridex-runtime-hardening.test.mjs .github/workflows/agent-runtime-compliance-fix.yml
          git diff --cached --check
          git commit -m "fix(api): harden portal versioning and workflow webhooks"
          git push origin HEAD:fix/api-runtime-compliance-20260817
