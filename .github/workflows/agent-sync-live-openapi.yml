name: Agent sync live OpenAPI

on:
  push:
    branches:
      - agent/sync-live-openapi-20260817

permissions:
  contents: write

concurrency:
  group: agent-sync-live-openapi-20260817
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[openapi-sync-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync canonical live OpenAPI
        run: npm run api:sync
      - name: Verify live contract
        run: npm run api:preflight
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify lint
        run: npm run lint
      - name: Commit canonical sync and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-sync-live-openapi.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi lib/ops/contract.ts lib/ops/generated .github/workflows/agent-sync-live-openapi.yml
          if git diff --cached --quiet; then
            echo "No OpenAPI sync changes produced."
            exit 1
          fi
          git commit -m "chore(api): sync live OpenAPI 2026-08-14.1 [openapi-sync-complete]"
          git push origin HEAD
