name: Bounded npm audit inspection

on:
  push:
    branches:
      - security/npm-audit-2026-08-14

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          PROD=$?
          echo '=== PRODUCTION AUDIT ==='
          cat /tmp/prod-audit.json
          echo "PROD_EXIT=$PROD"
          npm audit --json > /tmp/full-audit.json
          FULL=$?
          echo '=== FULL AUDIT ==='
          cat /tmp/full-audit.json
          echo "FULL_EXIT=$FULL"
          exit 0
