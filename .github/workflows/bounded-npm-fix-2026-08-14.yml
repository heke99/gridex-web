name: Bounded npm security fix

on:
  push:
    branches:
      - security/npm-audit-2026-08-14

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/npm-audit-2026-08-14
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply non-breaking lockfile audit fix
        run: npm audit fix --package-lock-only
      - name: Verify clean install and production audit
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ls nanoid
          npm audit --omit=dev --audit-level=high
          npm run api:preflight
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit lockfile-only fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = "package-lock.json" || {
            echo 'Unexpected files changed by npm audit fix'
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(security): update vulnerable nanoid transitive dependency'
          git push origin HEAD:security/npm-audit-2026-08-14
