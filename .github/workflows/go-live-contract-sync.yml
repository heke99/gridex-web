name: Go-live canonical contract sync

on:
  push:
    branches:
      - codex/gridex-web-go-live-20260819
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gridex-web-go-live-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply canonical organization cutover
        run: node scripts/go-live-organization-cutover.mjs
      - name: Persist organization cutover
        run: |
          if git diff --quiet; then
            echo "Organization cutover already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app lib tests
            git commit -m "fix(api): cut Web runtime over to organization references"
            git push origin HEAD:codex/gridex-web-go-live-20260819
          fi
      - name: Go-live repository inventory
        shell: bash
        run: |
          set -u
          echo '=== tenant/company/organization references ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=.git 'tenant_reference|tenantReference|company_id|companyId|organization_reference|organizationReference' app components lib tests scripts supabase 2>/dev/null | head -n 500 || true
          echo '=== browser/auth/supabase references ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=.git 'createBrowserClient|NEXT_PUBLIC_SUPABASE|SUPABASE_SERVICE|service_role|GRIDEX_API_KEY|GRIDEX_OPS_API_URL|mina-sidor|auth\.getUser|auth\.getSession' app components lib tests scripts 2>/dev/null | head -n 500 || true
          echo '=== checkout/idempotency/conversion references ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=.git 'idempotenc|web_checkout|conversion|gtag|google ads|google_ads|claim_web_conversion_dispatch|purchase|begin_checkout' app components lib tests scripts supabase 2>/dev/null | head -n 700 || true
          echo '=== cache/performance references ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=.git 'Cache-Control|cache-control|revalidate|unstable_cache|force-cache|no-store|ETag|If-None-Match|dynamic =|fetchPriority|priority=' app components lib tests 2>/dev/null | head -n 700 || true
          echo '=== files above 1800 lines ==='
          find app components lib tests scripts supabase -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.mjs' -o -name '*.sql' \) -print0 2>/dev/null | xargs -0 wc -l | awk '$1 > 1800 && $2 != "total" {print}' | sort -nr || true
      - name: Sync canonical live OpenAPI
        run: npm run api:sync
      - name: Commit canonical generated artifacts before verification
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No contract drift after live sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi lib/ops/contract.ts lib/ops/generated
          if git diff --cached --quiet; then
            echo "No generated contract artifacts changed."
            exit 0
          fi
          git commit -m "chore(api): sync canonical OPS contract for go-live"
          git push origin HEAD:codex/gridex-web-go-live-20260819
      - name: Verify API preflight
        run: npm run api:preflight
      - name: Verify migrations
        run: npm run db:migrations:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
