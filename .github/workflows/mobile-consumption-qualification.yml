name: Positive customer consumption qualification
concurrency:
  group: consumption-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      reuse_verified_android:
        description: Reuse Android proof from run43437329624 only if product code is identical
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/mobile-consumption-qualification.yml'
      - 'scripts/consumption-integration/**'
permissions:
  contents: read
  actions: read
  checks: read
env:
  GRIDEX_OPS_COMMIT: 2141580d77901e2e293b3af36fdc5a5b3267b9f2
  QUALIFICATION_WEB_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  # PR followups reuse the pinned successful Android source only after strict equivalence checks.
  GRIDEX_REUSE_VERIFIED_ANDROID: ${{ github.event_name == 'pull_request' || inputs.reuse_verified_android == true }}
jobs:
  source-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFICATION_WEB_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the loopback fixture and gateway safety boundaries
        run: |
          node --test tests/mobile-consumption-qualification.test.mjs
          python3 -B tests/mobile-consumption-native-evidence.test.py
      - name: Require green exact OPS and Web source gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/consumption-integration/consumption-wait-ci.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: consumption-source-gates
          path: ${{ runner.temp }}/consumption-source-gates.json
          retention-days: 7
  customer-stack:
    needs: source-gates
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      QUALIFICATION_WEB_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SUPABASE_TELEMETRY_DISABLED: 'true'
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          repository: heke99/gridex-ops-platform
          ref: ${{ env.GRIDEX_OPS_COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFICATION_WEB_COMMIT }}
          path: gridex-web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.101.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install exact locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix gridex-web --no-audit --no-fund
          npm ci --prefix gridex-web/apps/mobile --workspaces=false --no-audit --no-fund
      - name: Start the same isolated Auth, Web and OPS for HTTP and both native apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash gridex-web/scripts/consumption-integration/consumption-stack.sh > "$RUNNER_TEMP/consumption-stack.private.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/consumption-backend.pid"
          for attempt in $(seq 1 1200); do
            test ! -f "$RUNNER_TEMP/consumption-backend.ready" || exit 0
            kill -0 "$(cat "$RUNNER_TEMP/consumption-backend.pid")" 2>/dev/null || { echo 'Isolated consumption setup failed; inspect sanitized evidence.'; exit 1; }
            sleep 2
          done
          echo 'Consumption setup deadline reached.'; exit 1
      - uses: actions/upload-artifact@v4
        id: fixture_delivery
        with:
          name: ios-encrypted-customer-fixture
          path: ${{ runner.temp }}/ios-encrypted-fixture/
          retention-days: 1
          if-no-files-found: error
      - name: Reuse verified unchanged Android consumption evidence
        if: ${{ env.GRIDEX_REUSE_VERIFIED_ANDROID == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node gridex-web/scripts/consumption-integration/consumption-reuse-android.mjs
      - name: Enable disposable emulator KVM
        if: ${{ env.GRIDEX_REUSE_VERIFIED_ANDROID != 'true' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify only new positive Android consumption journeys
        if: ${{ env.GRIDEX_REUSE_VERIFIED_ANDROID != 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash gridex-web/scripts/consumption-integration/consumption-android.sh
      - name: Publish Android terminal marker
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/consumption-android-terminal"
          result=FAIL
          if test -f "$RUNNER_TEMP/mobile-runtime.env"; then
            source "$RUNNER_TEMP/mobile-runtime.env"
            if python3 gridex-web/scripts/consumption-integration/consumption-native-evidence.py android "$RUNNER_TEMP/mobile-android" --ops "$GRIDEX_OPS_COMMIT" --web "${GRIDEX_ANDROID_PROOF_COMMIT:-$GRIDEX_WEB_COMMIT}" --output "$RUNNER_TEMP/consumption-android-terminal/proof.json"; then result=PASS; fi
          fi
          printf '{"status":"%s"}\n' "$result" > "$RUNNER_TEMP/consumption-android-terminal/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumption-android-terminal
          path: ${{ runner.temp }}/consumption-android-terminal/
          retention-days: 7
      - name: Await the paired iOS native consumption result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f "$RUNNER_TEMP/consumption-backend.ready" && test "${{ steps.fixture_delivery.outcome }}" = success; then
            node gridex-web/scripts/mobile-integration/await-artifact.mjs ios-customer-terminal "$RUNNER_TEMP/consumption-ios-terminal"
            test "$(node -p 'require(process.env.RUNNER_TEMP+"/consumption-ios-terminal/result.json").status')" = success
            node gridex-web/scripts/mobile-integration/await-artifact.mjs positive-consumption-ios-evidence "$RUNNER_TEMP/consumption-ios-evidence"
            source "$RUNNER_TEMP/mobile-runtime.env"
            node gridex-web/scripts/consumption-integration/consumption-verdict.mjs
          fi
      - name: Stop and verify only owned disposable resources
        if: always()
        run: |
          touch "$RUNNER_TEMP/consumption-backend.stop"
          if test -f "$RUNNER_TEMP/consumption-backend.pid"; then
            for attempt in $(seq 1 90); do
              if ! kill -0 "$(cat "$RUNNER_TEMP/consumption-backend.pid")" 2>/dev/null; then
                node -e 'const r=require(process.env.RUNNER_TEMP+"/consumption-cleanup.json");if(r.exitCode!==0||r.ownedDatabaseContainersRemain)process.exit(1)'
                exit 0
              fi
              sleep 2
            done
            kill "$(cat "$RUNNER_TEMP/consumption-backend.pid")" 2>/dev/null || true
            echo 'Owned stack did not close by its deadline.'; exit 1
          fi
      - name: Sanitize setup diagnostics even if the runtime never became ready
        if: always()
        run: |
          for name in stack ops web; do
            node gridex-web/scripts/mobile-integration/sanitize-evidence.mjs log "$RUNNER_TEMP/consumption-$name.private.log" "$RUNNER_TEMP/consumption-$name.sanitized.log" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: positive-consumption-system-evidence
          path: |
            ${{ runner.temp }}/consumption-source-gates.json
            ${{ runner.temp }}/consumption-http.json
            ${{ runner.temp }}/consumption-outage.json
            ${{ runner.temp }}/consumption-recovery.json
            ${{ runner.temp }}/consumption-native-observations.json
            ${{ runner.temp }}/consumption-system-result.json
            ${{ runner.temp }}/consumption-cleanup.json
            ${{ runner.temp }}/consumption-android-reuse.json
            ${{ runner.temp }}/consumption-android-reused-observations.json
            ${{ runner.temp }}/consumption-*.sanitized.log
            ${{ runner.temp }}/mobile-android/
          retention-days: 7
          if-no-files-found: error
  ios-customer:
    needs: source-gates
    runs-on: macos-26
    timeout-minutes: 160
    env:
      CI: '1'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      EXPO_NO_TELEMETRY: '1'
      QUALIFICATION_WEB_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      GRIDEX_BUILD_ENVIRONMENT: isolated-real-auth-web-ops-consumption
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFICATION_WEB_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create this job's private fixture recipient
        run: node scripts/mobile-integration/device-fixture.mjs keypair "$RUNNER_TEMP/consumption-ios.key" "$RUNNER_TEMP/ios-public-key"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-device-public-key
          path: ${{ runner.temp }}/ios-public-key/
          retention-days: 1
      - run: npm ci --workspaces=false --ignore-scripts --no-audit --no-fund
        working-directory: apps/mobile
      - name: Receive the same stack's encrypted synthetic identities
        env:
          GH_TOKEN: ${{ github.token }}
          GRIDEX_DEVICE_PRIVATE_KEY: ${{ runner.temp }}/consumption-ios.key
        run: |
          node scripts/consumption-integration/consumption-await-fixture.mjs "$RUNNER_TEMP/ios-encrypted-fixture"
          node scripts/mobile-integration/device-fixture.mjs decrypt "$RUNNER_TEMP/ios-encrypted-fixture/device-fixture.encrypted.json" "$RUNNER_TEMP/consumption-ios.env"
      - name: Build the actual isolated-backend simulator app
        run: |
          source "$RUNNER_TEMP/consumption-ios.env"
          unset LOGIN_A_EMAIL LOGIN_A_PASSWORD LOGIN_B_EMAIL LOGIN_B_PASSWORD GRIDEX_QUALIFICATION_CONTROL_KEY
          bash scripts/mobile-integration/ios-build.sh
      - name: Verify only positive iOS consumption after Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/consumption-integration/consumption-await-android.mjs "$RUNNER_TEMP/consumption-android-terminal"
          test "$(node -p 'require(process.env.RUNNER_TEMP+"/consumption-android-terminal/result.json").status')" = PASS
          source "$RUNNER_TEMP/consumption-ios.env"
          bash scripts/consumption-integration/consumption-ios.sh
      - name: Record terminal result and remove owned credentials and simulator
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/consumption-ios-terminal" "$RUNNER_TEMP/consumption-ios"
          cleanup_result=0
          if test -f "$RUNNER_TEMP/consumption-ios-simulator"; then
            python3 scripts/consumption-integration/consumption-native-evidence.py cleanup "$RUNNER_TEMP/consumption-ios-simulator" --output "$RUNNER_TEMP/consumption-ios/cleanup.json" || cleanup_result=1
          elif test "$RESULT" = success; then
            cleanup_result=1
          fi
          CLEANUP_RESULT="$cleanup_result" node -e 'const ok=process.env.RESULT==="success"&&process.env.CLEANUP_RESULT==="0";require("fs").writeFileSync(process.env.RUNNER_TEMP+"/consumption-ios-terminal/result.json",JSON.stringify({status:ok?"success":"failure",webCommit:process.env.QUALIFICATION_WEB_COMMIT,opsCommit:process.env.GRIDEX_OPS_COMMIT,cleanupVerified:ok}))'
          rm -f "$RUNNER_TEMP/consumption-ios.key" "$RUNNER_TEMP/consumption-ios.env"
          test "$cleanup_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-customer-terminal
          path: ${{ runner.temp }}/consumption-ios-terminal/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: positive-consumption-ios-evidence
          path: |
            ${{ runner.temp }}/consumption-ios/
            ${{ runner.temp }}/gridex-ios-artifacts/
          retention-days: 7
          if-no-files-found: warn
