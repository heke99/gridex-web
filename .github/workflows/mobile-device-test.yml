name: Gridex Android device test APK

on:
  workflow_dispatch:
    inputs:
      ios_artifact_run:
        description: 'Optional same-repository production iOS artifact run for keyboard diagnostics'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - '.github/workflows/mobile-device-test.yml'

permissions:
  contents: read
  actions: read

jobs:
  android-device-test:
    if: ${{ !inputs.ios_artifact_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --workspaces=false --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Build a self-contained APK with the test package identifier
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_CUSTOMER_API_URL: https://gridex.se
          EXPO_PUBLIC_SUPABASE_URL: https://ayiuxjlfazkjmmtlvhsl.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ujlw8IZgah81tHErkcw2JQ_RL_bkJvV
        run: |
          npm exec --no -- expo prebuild --platform android --no-install
          cd android
          ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Verify signature, application ID and embedded JavaScript
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify "$apk"
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/gridex-apk-badging.txt"
          grep -F "package: name='se.gridex.el.dev'" "$RUNNER_TEMP/gridex-apk-badging.txt"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/gridex-apk-files.txt"
          grep -Fx 'assets/index.android.bundle' "$RUNNER_TEMP/gridex-apk-files.txt"
          mkdir -p "$RUNNER_TEMP/gridex-device-test"
          cp "$apk" "$RUNNER_TEMP/gridex-device-test/gridex-el-test.apk"
          cd "$RUNNER_TEMP/gridex-device-test"
          sha256sum gridex-el-test.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gridex-android-device-test
          path: ${{ runner.temp }}/gridex-device-test/
          if-no-files-found: error
          retention-days: 7

  ios-keyboard-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ios_artifact_run != '' }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      QUALIFICATION_WEB_COMMIT: ${{ github.sha }}
      GRIDEX_IOS_DIAGNOSTIC: 'true'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      CI: '1'
      EXPO_PUBLIC_CUSTOMER_API_URL: https://gridex.se
      EXPO_PUBLIC_SUPABASE_URL: https://ayiuxjlfazkjmmtlvhsl.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ujlw8IZgah81tHErkcw2JQ_RL_bkJvV
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: gridex-ios-simulator
          run-id: ${{ inputs.ios_artifact_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gridex-ios-artifacts/
      - name: Verify and reuse the exact native input trees
        run: bash scripts/mobile-integration/ios-reuse-native.sh
      - name: Capture focused hierarchy using the intentional diagnostic assertion
        run: bash scripts/mobile-integration/ios-smoke.sh
      - name: Preserve invalid-form diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridex-ios-keyboard-diagnostic
          path: ${{ runner.temp }}/gridex-ios-artifacts/
          retention-days: 7
      - name: Remove owned simulator
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/gridex-ios-simulator-id"; then
            xcrun simctl shutdown "$(cat "$RUNNER_TEMP/gridex-ios-simulator-id")" || true
            xcrun simctl delete "$(cat "$RUNNER_TEMP/gridex-ios-simulator-id")" || true
          fi
