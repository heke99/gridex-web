name: Gridex iOS simulator qualification
concurrency:
  group: mobile-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mobile-ios-qualification.yml'
      - 'scripts/mobile-integration/ios-*'
      - 'apps/mobile/**'

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_CUSTOMER_API_URL: https://gridex.se
      EXPO_PUBLIC_SUPABASE_URL: https://ayiuxjlfazkjmmtlvhsl.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ujlw8IZgah81tHErkcw2JQ_RL_bkJvV
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --workspaces=false --ignore-scripts --no-audit --no-fund
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
      - name: Build a native release application for the simulator
        id: nativebuild
        run: bash scripts/mobile-integration/ios-build.sh
      - name: Install and exercise native UI on a notched iPhone simulator
        timeout-minutes: 15
        run: |
          bash scripts/mobile-integration/ios-smoke.sh
          test -s "$RUNNER_TEMP/gridex-ios-artifacts/simulator-receipt.json"
          test -s "$RUNNER_TEMP/gridex-ios-artifacts/ui/results.xml"
      - name: Build the unsigned physical-device distribution candidate
        if: ${{ !cancelled() && steps.nativebuild.outcome == 'success' }}
        run: bash scripts/mobile-integration/ios-archive.sh
      - name: Preserve build and simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridex-ios-simulator
          path: ${{ runner.temp }}/gridex-ios-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Stop owned simulator
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/gridex-ios-simulator-id"; then
            xcrun simctl shutdown "$(cat "$RUNNER_TEMP/gridex-ios-simulator-id")" || true
            xcrun simctl delete "$(cat "$RUNNER_TEMP/gridex-ios-simulator-id")" || true
          fi
