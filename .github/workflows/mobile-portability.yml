name: Mobile portability foundation

on:
  pull_request:
    paths:
      - 'packages/mobile-foundation/**'
      - 'packages/customer-backend/**'
      - 'scripts/check-mobile-readiness.mjs'
      - 'apps/mobile/**'
      - 'scripts/export-mobile-foundation.mjs'
      - 'scripts/export-mobile-app.mjs'
      - 'docs/mobile/**'
      - 'tests/mobile-*'
      - 'lib/mobile/**'
      - 'app/api/mobile/**'
      - '.github/workflows/mobile-portability.yml'
  push:
    branches: [main]
    paths:
      - 'packages/mobile-foundation/**'
      - 'packages/customer-backend/**'
      - 'scripts/check-mobile-readiness.mjs'
      - 'apps/mobile/**'
      - 'scripts/export-mobile-foundation.mjs'
      - 'scripts/export-mobile-app.mjs'
      - 'docs/mobile/**'
      - 'tests/mobile-*'
      - 'lib/mobile/**'
      - 'app/api/mobile/**'
      - '.github/workflows/mobile-portability.yml'

permissions:
  contents: read

jobs:
  standalone-export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual mobile routes with synthetic Auth and OPS
        run: node --experimental-strip-types --experimental-loader ./tests/mobile-read-loader.mjs --test tests/mobile-detail-routes.test.mjs tests/mobile-extras.test.mjs
      - run: node --experimental-strip-types --experimental-loader ./tests/mobile-read-loader.mjs --test packages/mobile-foundation/test/brand.test.mjs tests/mobile-foundation-export.test.mjs tests/mobile-app-export.test.mjs tests/mobile-backend-neutral.test.mjs tests/mobile-readiness.test.mjs tests/mobile-market-prices.test.mjs tests/mobile-account-writes.test.mjs tests/mobile-contracts-handler.test.mjs tests/mobile-secure-storage.test.mjs tests/mobile-customer-data.test.mjs tests/mobile-customer-resources.test.mjs tests/mobile-details.test.mjs tests/mobile-detail-data.test.mjs tests/mobile-support-writes.test.mjs

  native-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --workspaces=false --ignore-scripts --no-audit --no-fund
      - name: Account lifecycle with synthetic Auth
        run: node --experimental-strip-types --experimental-loader ../../tests/mobile-account-loader.mjs --test ../../tests/mobile-account-lifecycle.test.mjs ../../tests/mobile-account-adapter.test.mjs ../../tests/mobile-contract-actions.test.mjs ../../tests/mobile-market-ui.test.mjs ../../tests/mobile-phone-editor.test.mjs
      - run: npm run typecheck
      - run: npm run export:android
      - run: npx expo export --platform ios --output-dir dist-ios

  portable-native-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Extract complete native source outside repository
        run: node scripts/export-mobile-app.mjs "$RUNNER_TEMP/portable-energy-app"
      - name: Install and verify extracted application
        run: |
          cd "$RUNNER_TEMP/portable-energy-app/apps/mobile"
          npm ci --workspaces=false --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run export:android
          npx expo export --platform ios --output-dir dist-ios
