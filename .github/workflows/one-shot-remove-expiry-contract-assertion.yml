name: One-shot remove legacy quote expiry assertion
on:
  push:
    branches: [fix/non-expiring-customer-price-20260822]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/non-expiring-customer-price-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/one-shot-remove-expiry-contract-assertion.cjs
      - run: node --experimental-strip-types --experimental-loader ./tests/typescript-alias-loader.mjs tests/website-api.contract.test.mjs
      - run: |
          rm .github/workflows/one-shot-remove-expiry-contract-assertion.yml
          rm scripts/one-shot-remove-expiry-contract-assertion.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(pricing): remove legacy quote expiry contract assertion"
          git push origin HEAD:fix/non-expiring-customer-price-20260822
