name: OpenAPI compatibility
on:
  pull_request:
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync exact live OpenAPI and regenerate types
        run: npm run api:refresh
      - name: Verify client compatibility with the live contract
        run: npm run api:contract
