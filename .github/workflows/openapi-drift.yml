name: OpenAPI compatibility
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Block unknown OpenAPI versions or schema hashes
        run: npm run api:preflight
