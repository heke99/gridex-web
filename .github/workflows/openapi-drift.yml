name: Apply canonical application contract correction

on:
  push:
    branches:
      - fix/sync-ops-schema-20260822

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sync-ops-schema-20260822
          fetch-depth: 0
      - name: Remove non-contractual application settlement propagation
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          application = 'lib/ops/client/application.ts'
          replace(
              application,
              "export type OpsCustomerApplicationSettlement = WebsiteApiComponents['schemas']['WebsiteQuoteSettlement']\n\nexport function buildOpsCustomerApplicationPayload(\n  input: OpsCustomerApplicationInput,\n  settlement: OpsCustomerApplicationSettlement,\n) {",
              "export function buildOpsCustomerApplicationPayload(input: OpsCustomerApplicationInput) {",
          )
          replace(
              application,
              "  const startDate = normalizeText(input.start_date)\n  if (!settlement || typeof settlement !== 'object') {\n    throw new OpsError('Canonical settlement-bevis saknas i kundansökan.', 400, {\n      code: 'settlement_required',\n      field: 'settlement',\n      retryable: false,\n    })\n  }\n  if (!externalCustomerId) {",
              "  const startDate = normalizeText(input.start_date)\n  if (!externalCustomerId) {",
          )
          replace(
              application,
              "    quote_reference: quoteReference!,\n    settlement,\n    price_option_reference: priceOptionReference!,",
              "    quote_reference: quoteReference!,\n    price_option_reference: priceOptionReference!,",
          )
          replace(
              application,
              "export async function submitOpsCustomerApplication(\n  input: OpsCustomerApplicationInput,\n  settlement: OpsCustomerApplicationSettlement,\n): Promise<AcceptedOpsCustomerApplicationResult> {",
              "export async function submitOpsCustomerApplication(\n  input: OpsCustomerApplicationInput,\n): Promise<AcceptedOpsCustomerApplicationResult> {",
          )
          replace(
              application,
              "  const applicationPayload = buildOpsCustomerApplicationPayload(input, settlement);",
              "  const applicationPayload = buildOpsCustomerApplicationPayload(input);",
          )

          signup = 'app/(public)/teckna-avtal/page.tsx'
          replace(
              signup,
              "    const settlementRecord = asRecord(verifiedQuote.value.quote.raw?.settlement);\n    if (!settlementRecord) {\n      console.error('[website signup] canonical quote settlement missing after validation', {\n        offer_reference: offer.offer_reference,\n        quote_reference: verifiedQuote.value.quote.ops_quote_reference,\n      });\n      return fail('price_changed', {\n        step: 1,\n        fieldErrors: { pricing: 'Prisunderlagets avräkningsmodell kunde inte verifieras.' },\n      });\n    }\n    const canonicalSettlement =\n      settlementRecord as Parameters<typeof buildOpsCustomerApplicationPayload>[1];\n    const serverPriceAreaCode = verifiedQuote.value.area.priceAreaCode;",
              "    const serverPriceAreaCode = verifiedQuote.value.area.priceAreaCode;",
          )
          replace(
              signup,
              "          buildOpsCustomerApplicationPayload(applicationInput, canonicalSettlement),",
              "          buildOpsCustomerApplicationPayload(applicationInput),",
          )
          replace(
              signup,
              "    const submitApplicationToOps = () =>\n      submitOpsCustomerApplication(applicationInput, canonicalSettlement);",
              "    const submitApplicationToOps = () => submitOpsCustomerApplication(applicationInput);",
          )

          test = 'tests/website-api.contract.test.mjs'
          replace(
              test,
              "for (const field of ['price_option_reference', 'invoice_delivery_method', 'selected_component_references', 'site_count', 'settlement']) assert.ok(applicationSchema.required.includes(field), `customer application field must be required: ${field}`)",
              "for (const field of ['price_option_reference', 'invoice_delivery_method', 'selected_component_references', 'site_count']) assert.ok(applicationSchema.required.includes(field), `customer application field must be required: ${field}`)",
          )
          replace(
              test,
              "  }],\n}, {\n  model: 'market_hourly',\n  customer_accepts: 'pricing_model',\n  energy_price_locked_at_signup: false,\n  uses_actual_metered_consumption: true,\n  market_data_role: 'indicative_preview_only',\n  settlement_resolution: 'hour',\n})",
              "  }],\n})",
          )
          replace(
              test,
              "assert.equal(applicationPayload.quote_reference, 'quote_test')\nassert.deepEqual(applicationPayload.settlement, {\n  model: 'market_hourly',\n  customer_accepts: 'pricing_model',\n  energy_price_locked_at_signup: false,\n  uses_actual_metered_consumption: true,\n  market_data_role: 'indicative_preview_only',\n  settlement_resolution: 'hour',\n})\n",
              "assert.equal(applicationPayload.quote_reference, 'quote_test')\n",
          )
      - name: Restore canonical CI workflow
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/openapi-drift.yml
      - name: Commit corrected contract wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ops/client/application.ts app/'(public)'/teckna-avtal/page.tsx tests/website-api.contract.test.mjs .github/workflows/openapi-drift.yml
          git commit -m "fix(api): keep settlement bound to canonical quote evidence"
          git push origin HEAD:fix/sync-ops-schema-20260822
