name: OpenAPI compatibility
on:
  pull_request:
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify checked-in OpenAPI and generated types against production
        run: npm run api:check
      - name: Verify runtime compatibility with the checked-in contract
        run: npm run api:contract
