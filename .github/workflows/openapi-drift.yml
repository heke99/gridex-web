name: OpenAPI compatibility

on:
  push:
    branches:
      - main
      - fix/sync-ops-schema-20260822
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sync-ops-schema-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch settlement propagation into application payload
        shell: python
        run: |
          from pathlib import Path

          types = Path('lib/ops/client/types.ts')
          text = types.read_text()
          dto_anchor = "export type OpsCustomerApplicationRequestDto = WebsiteApiComponents['schemas']['CustomerApplicationRequest'];\n"
          if dto_anchor not in text:
              raise SystemExit('CustomerApplicationRequest DTO anchor missing')
          if 'export type OpsWebsiteQuoteSettlement' not in text:
              text = text.replace(dto_anchor, dto_anchor + "export type OpsWebsiteQuoteSettlement = WebsiteApiComponents['schemas']['WebsiteQuoteSettlement'];\n", 1)
          input_anchor = "  quote_reference: string;\n  price_option_reference: string;\n"
          if input_anchor not in text:
              raise SystemExit('OpsCustomerApplicationInput quote anchor missing')
          text = text.replace(input_anchor, "  quote_reference: string;\n  settlement: OpsWebsiteQuoteSettlement;\n  price_option_reference: string;\n", 1)
          types.write_text(text)

          app = Path('lib/ops/client/application.ts')
          text = app.read_text()
          payload_anchor = "    quote_reference: quoteReference!,\n    price_option_reference: priceOptionReference!,\n"
          if payload_anchor not in text:
              raise SystemExit('application payload quote anchor missing')
          text = text.replace(payload_anchor, "    quote_reference: quoteReference!,\n    settlement: input.settlement,\n    price_option_reference: priceOptionReference!,\n", 1)
          app.write_text(text)

          test = Path('tests/website-api.contract.test.mjs')
          text = test.read_text()
          text = text.replace(
              "for (const field of ['price_option_reference', 'invoice_delivery_method', 'selected_component_references', 'site_count'])",
              "for (const field of ['settlement', 'price_option_reference', 'invoice_delivery_method', 'selected_component_references', 'site_count'])",
              1,
          )
          fixture_anchor = "  quote_reference: 'quote_test',\n  price_option_reference: 'price_option_test',\n"
          if fixture_anchor not in text:
              raise SystemExit('website API application fixture quote anchor missing')
          settlement = (
              "  quote_reference: 'quote_test',\n"
              "  settlement: {\n"
              "    model: 'market_monthly',\n"
              "    customer_accepts: 'pricing_model',\n"
              "    energy_price_locked_at_signup: false,\n"
              "    uses_actual_metered_consumption: true,\n"
              "    market_data_role: 'indicative_preview_only',\n"
              "    settlement_resolution: 'month',\n"
              "  },\n"
              "  price_option_reference: 'price_option_test',\n"
          )
          text = text.replace(fixture_anchor, settlement, 1)
          test.write_text(text)
      - name: Verify full Web contract and production build
        run: |
          npm run api:check:local
          npm run api:compatibility
          npm run typecheck
          npm test
          npm run build
      - name: Restore read-only workflow and commit settlement wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/openapi-drift.yml
          git rm -f scripts/.settlement-patch-trigger || true
          git add lib/ops/client/types.ts lib/ops/client/application.ts tests/website-api.contract.test.mjs .github/workflows/openapi-drift.yml
          git commit -m "fix(checkout): propagate canonical quote settlement to OPS application"
          git pull --rebase origin fix/sync-ops-schema-20260822
          git push origin HEAD:fix/sync-ops-schema-20260822
