name: OPS contract sync

on:
  push:
    branches:
      - remediation/production-hardening-2026-08-14

permissions:
  contents: write

concurrency:
  group: ops-contract-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synchronize canonical OPS OpenAPI release
        run: npm run api:sync
      - name: Verify synchronized delivery
        run: npm run verify:delivery
      - name: Commit verified generated artifacts
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "OPS contract is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi lib/ops/contract.ts lib/ops/generated
          git commit -m "chore(api): sync canonical OPS contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"
