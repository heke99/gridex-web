name: post-auth-checkout-patcher

on:
  push:
    branches:
      - fix/post-auth-checkout-20260820

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-auth-checkout-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/post-auth-checkout-cutover.mjs
      - run: npm ci
      - run: npm run api:generate
      - name: Persist post-auth checkout cutover
        run: |
          if git diff --quiet; then
            echo "No checkout drift remains."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'app/(public)/teckna-avtal/page.tsx' \
            components/signup/CustomerApplicationForm.tsx \
            lib/ops/client/types.ts \
            lib/ops/client/application.ts \
            docs/openapi/website-integration-v1.json \
            docs/openapi/customer-portal-v1.json \
            lib/ops/generated/website-api.d.ts \
            lib/ops/generated/customer-portal-api.d.ts \
            lib/ops/contract.ts
          git commit -m "fix(checkout): allow tenant-scoped post-auth onboarding"
          git push origin HEAD:fix/post-auth-checkout-20260820
