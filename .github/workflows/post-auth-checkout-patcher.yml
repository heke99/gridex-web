name: post-auth-checkout-verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-auth-checkout-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync canonical live OpenAPI release
        run: npm run api:sync
      - name: Verify local API contract and TypeScript
        run: |
          npm run api:check:local
          npm run api:compatibility:known-gaps
          npm run typecheck
      - name: Verify checkout and post-commit behavior
        run: |
          node tests/automatic-checkout-policy.test.mjs
          node tests/checkout-post-commit-durability.test.mjs
          node --experimental-strip-types --experimental-loader ./tests/typescript-alias-loader.mjs tests/website-signup-hardening.test.mjs
          npm run test:customer-application
          npm run test:portal
      - name: Production build
        run: npm run build
      - name: Persist verified live contract artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Web client already matches the verified live contract."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/openapi lib/ops/generated lib/ops/contract.ts
          git commit -m "chore(api): sync live OpenAPI 2026-08-20.2"
          git push origin HEAD:fix/post-auth-checkout-20260820
