name: Gridex Web quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - remediation/gridex-web-performance-integrity-api-2026-08-07

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Sync live OpenAPI on remediation branch
        if: github.ref == 'refs/heads/remediation/gridex-web-performance-integrity-api-2026-08-07'
        run: npm run api:sync
      - name: OpenAPI live drift
        run: npm run api:check:live
      - name: Migration manifest
        run: npm run db:migrations:check
      - name: API compatibility
        run: npm run api:compatibility
      - name: Production file-size guard
        run: node scripts/check-file-size.mjs
      - name: Contract-version observation regression
        run: node --experimental-strip-types --experimental-loader ./tests/typescript-alias-loader.mjs tests/ops-contract-version-observation.test.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Persist verified live OpenAPI sync
        if: github.ref == 'refs/heads/remediation/gridex-web-performance-integrity-api-2026-08-07'
        run: |
          if [ -z "$(git status --porcelain -- docs/openapi lib/ops/contract.ts lib/ops/generated SHA256SUMS.txt)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi lib/ops/contract.ts lib/ops/generated SHA256SUMS.txt
          git commit -m "fix: sync OpenAPI artifacts to current live OPS"
          git push origin HEAD:remediation/gridex-web-performance-integrity-api-2026-08-07
