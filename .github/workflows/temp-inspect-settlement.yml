name: Temporary settlement inspection

on:
  push:
    branches:
      - fix/sync-ops-schema-20260822

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate settlement and application flow
        run: |
          echo '=== settlement references ==='
          rg -n "settlement|WebsiteQuoteSettlement" app lib tests || true
          echo '=== customer application builder references ==='
          rg -n "buildOpsCustomerApplicationPayload|submitOpsCustomerApplication|OpsCustomerApplicationInput" app lib tests || true
          echo '=== pricing preview references ==='
          rg -n "OpsWebsitePricingPreview|ops_quote_reference|quote_reference" app lib/website lib/ops tests | head -n 500 || true
