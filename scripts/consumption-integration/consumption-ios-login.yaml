appId: se.gridex.el.dev
---
- scrollUntilVisible:
    element: "E-post"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    text: "E-post"
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 5000
# iOS backspace erases before the caret. Select the retained address in full first.
- runFlow:
    when:
      true: ${LOGIN_PHASE === 'ios:B:login'}
    commands:
      - longPressOn: "E-post"
      - runFlow:
          when:
            visible: "^(Select All|Markera allt)$"
          commands:
            - tapOn: "^(Select All|Markera allt)$"
- eraseText: 200
# The actual Auth-grant observer below requires the exact expected identity and password.
- inputText: ${EMAIL}
- scrollUntilVisible:
    element: "Lösenord"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Lösenord"
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 5000
- eraseText: 200
- inputText: ${PASSWORD}
- runFlow: ../mobile-integration/ios-dismiss-keyboard.yaml
- scrollUntilVisible:
    element: "Logga in"
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible:
      text: "Logga in"
      enabled: true
    timeout: 30000
- runScript:
    file: consumption-ios-control.js
    env:
      ACTION: auth-snapshot
      PHASE: ${LOGIN_PHASE}
- tapOn:
    text: "Logga in"
    retryTapIfNoChange: false
- runScript:
    file: consumption-ios-control.js
    env:
      ACTION: auth-observed
      PHASE: ${LOGIN_PHASE}
- scrollUntilVisible:
    element: ${CONTRACT}
    direction: DOWN
    timeout: 60000
