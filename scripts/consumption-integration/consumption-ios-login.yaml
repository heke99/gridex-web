appId: se.gridex.el.dev
---
- scrollUntilVisible:
    element: "E-post"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "E-post"
- eraseText: 200
- inputText: ${EMAIL}
- scrollUntilVisible:
    element: "Lösenord"
    direction: DOWN
    centerElement: true
- tapOn: "Lösenord"
- eraseText: 200
- inputText: ${PASSWORD}
- runFlow: ../mobile-integration/ios-dismiss-keyboard.yaml
- scrollUntilVisible:
    element: "Logga in"
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible:
      text: "Logga in"
      enabled: true
    timeout: 30000
- runScript:
    file: consumption-ios-control.js
    env:
      ACTION: auth-snapshot
      PHASE: ${LOGIN_PHASE}
- tapOn:
    text: "Logga in"
    retryTapIfNoChange: false
- runScript:
    file: consumption-ios-control.js
    env:
      ACTION: auth-observed
      PHASE: ${LOGIN_PHASE}
- scrollUntilVisible:
    element: ${CONTRACT}
    direction: DOWN
    timeout: 60000
