appId: se.gridex.el.dev
---
- runScript: ios-customer-resource.js
- scrollUntilVisible:
    element: "Mina sidor"
    direction: UP
    timeout: 60000
- scrollUntilVisible:
    element: ${output.customerResourceLabel}
    direction: DOWN
    centerElement: true
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
# Authenticated panel only; the fixed screenshot is overwritten on each switch.
- takeScreenshot: "customer-resource-target"
- tapOn:
    text: ${output.customerResourceLabel}
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "customer-resource-target"
- runFlow:
    when:
      true: ${CUSTOMER_RESOURCE === 'support'}
    commands:
      # Require loaded list content; a large container ID may be absent in AX.
      - scrollUntilVisible:
          element: "Sök bland hämtade ärenden"
          direction: DOWN
          timeout: 60000
      - assertNotVisible: "Hämtar kunduppgifter"
- runFlow:
    when:
      true: ${CUSTOMER_RESOURCE !== 'support'}
    commands:
      - extendedWaitUntil:
          visible:
            id: ${output.customerResourceIdle}
          timeout: 60000
