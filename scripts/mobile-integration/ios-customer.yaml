    direction: UP
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Idag"
    retryTapIfNoChange: false
- scrollUntilVisible:
    element: "Visa alla [0-9]+ intervallpriser"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Visa alla [0-9]+ intervallpriser"
    retryTapIfNoChange: false
- assertVisible: "Dölj intervallpriser"
- takeScreenshot: "public-market-prices"
- tapOn: "Dölj intervallpriser"
- runScript:
    file: ios-control.js
    env:
      ACTION: disconnect-market
- scrollUntilVisible:
    element: "Spotpriser"
    direction: UP
    timeout: 60000
- scrollUntilVisible:
    element: "Uppdatera elpriser"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Uppdatera elpriser"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Elpriserna kunde inte hämtas. Försök igen."
    timeout: 30000
- takeScreenshot: "market-network-error"
- runScript:
    file: ios-control.js
    env:
      ACTION: reconnect-market
- scrollUntilVisible:
    element: "Spotpriser"
    direction: UP
    timeout: 60000
- scrollUntilVisible:
    element: "Uppdatera elpriser"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Uppdatera elpriser"
    retryTapIfNoChange: false
- scrollUntilVisible:
    element: "${output.marketToday} · SE4"
    direction: DOWN
- takeScreenshot: "market-retry-recovery"

- scrollUntilVisible:
    element: "Imorgon"
    direction: UP
    centerElement: true
- runScript: ios-future-market.js
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Imorgon"
    retryTapIfNoChange: false
- scrollUntilVisible:
    element: "${output.marketTomorrow} · SE4"
    direction: DOWN
- runFlow:
    when:
      true: ${output.futureEntries === 0}
    commands:
      - scrollUntilVisible:
          element: "Inga priser har publicerats för det valda dygnet."
          direction: DOWN
          timeout: 60000
- runFlow:
    when:
      true: ${output.futureEntries > 0}
    commands:
      - scrollUntilVisible:
          element: "Visa alla [0-9]+ intervallpriser"
          direction: DOWN
          timeout: 60000
- takeScreenshot: "market-future-day"
- tapOn: "Mer"
- pressKey: Home
- runScript:
    file: ios-control.js
    env:
      ACTION: revoke-b
- runScript:
    file: ios-control.js
    env:
      ACTION: wait-expiry-tick
- runFlow: ios-resume-app.yaml
- extendedWaitUntil:
    visible: "Logga in på Mina sidor"
    timeout: 60000
- assertNotVisible: ".*${CONTRACT_B}.*"
- assertNotVisible: ".*${INVOICE_B}.*"
- scrollUntilVisible:
    element: "E-post"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "E-post"
    retryTapIfNoChange: false
- eraseText: 200
- runFlow: ios-dismiss-keyboard.yaml
- takeScreenshot: "invalidated-session-foreground"
- stopApp
- runFlow: ios-resume-app.yaml
- tapOn: "Mer"
- assertVisible: "Logga in på Mina sidor"
- assertNotVisible: ".*${CONTRACT_B}.*"
- assertNotVisible: ".*${INVOICE_B}.*"
- takeScreenshot: "invalid-session-not-restored"
- scrollUntilVisible:
    element: "Glömt lösenord? Återställ på hemsidan"
    direction: DOWN
    centerElement: true
- runScript:
    file: ios-control.js
    env:
      ACTION: snapshot-handoff-recovery
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Glömt lösenord? Återställ på hemsidan"
    retryTapIfNoChange: false
- runScript:
    file: ios-control.js
    env:
      ACTION: assert-handoff-recovery
- extendedWaitUntil:
    visible: "Återställ lösenord"
    timeout: 60000
- takeScreenshot: "recovery-external-web"
- runFlow: ios-resume-app.yaml
- assertVisible: "Logga in på Mina sidor"
- tapOn: "Hem"
- scrollUntilVisible:
    element: "Teckna nytt elavtal.*"
    direction: DOWN
    centerElement: true
- runScript:
    file: ios-control.js
    env:
      ACTION: snapshot-handoff-signup
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Teckna nytt elavtal.*"
    retryTapIfNoChange: false
- runScript:
    file: ios-control.js
    env:
      ACTION: assert-handoff-signup
- runFlow: ios-resume-app.yaml
- scrollUntilVisible:
    element: "Visa befintliga avtal.*"
    direction: DOWN
    centerElement: true
- runScript:
    file: ios-control.js
    env:
      ACTION: snapshot-handoff-contracts
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Visa befintliga avtal.*"
    retryTapIfNoChange: false
- runScript:
    file: ios-control.js
    env:
      ACTION: assert-handoff-contracts
- runFlow: ios-resume-app.yaml
- scrollUntilVisible:
    element: "Få hjälp att byta avtal.*"
    direction: DOWN
    centerElement: true
- runScript:
    file: ios-control.js
    env:
      ACTION: snapshot-handoff-support
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Få hjälp att byta avtal.*"
    retryTapIfNoChange: false
- runScript:
    file: ios-control.js
    env:
      ACTION: assert-handoff-support
- runFlow: ios-resume-app.yaml
- takeScreenshot: "contract-web-return"
