appId: se.gridex.el.dev
---
- launchApp:
    clearState: true
- tapOn: "Mer"
- scrollUntilVisible:
    element: "E-post"
    direction: DOWN
- tapOn: "E-post"
- inputText: "synthetic-ui-only@example.invalid"
- scrollUntilVisible:
    element: "Lösenord"
    direction: DOWN
- tapOn: "Lösenord"
- inputText: "synthetic-ui-only-no-login"
- takeScreenshot: "keyboard-input-active"
- runFlow:
    when:
      visible: "Stäng tangentbord"
    commands:
      - tapOn: "Stäng tangentbord"
- swipe:
    direction: DOWN
- takeScreenshot: "keyboard-after-drag"
- scrollUntilVisible:
    element: "Logga in"
    direction: DOWN
- assertVisible: "Logga in"
- takeScreenshot: "keyboard-login-accessible"
- tapOn: "Elpriser"
- assertVisible: "Följ elpriset"
- takeScreenshot: "notched-price-navigation"
- tapOn: "Hem"
- assertVisible: "Din el. Samlad på ett ställe."
- takeScreenshot: "notched-home-navigation"
