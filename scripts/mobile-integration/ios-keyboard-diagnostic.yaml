# Fixed invalid inputs only. Final assertion intentionally captures a hierarchy.
appId: se.gridex.el.dev
---
- launchApp:
    clearState: false
- tapOn: "Mer"
- takeScreenshot: "login-before-input"
- scrollUntilVisible:
    element: "E-post"
    direction: DOWN
- tapOn: "E-post"
- inputText: "synthetic-ui-only@example.invalid"
- takeScreenshot: "keyboard-email-input"
- scrollUntilVisible:
    element: "Lösenord"
    direction: DOWN
- tapOn: "Lösenord"
- takeScreenshot: "keyboard-password-focused"
- inputText: "synthetic-ui-only-no-login"
- takeScreenshot: "keyboard-input-active"
- assertVisible: "__GRIDEX_DIAGNOSTIC_CAPTURE_FOCUSED_HIERARCHY__"
